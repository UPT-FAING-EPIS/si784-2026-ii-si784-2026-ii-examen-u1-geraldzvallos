name: generate-documentation
on:
  push:
    branches: [main]
    paths: ['database/**', 'src/**', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate-docs.js
      - uses: actions/upload-artifact@v4
        with:
          name: documentacion
          path: docs/
      - name: Commit de la documentacion
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "docs: actualizar diagramas y diccionario de datos" && git push)
